    <h3>Componente padre che RICEVE info dal figlio</h3>

    <app-son

        (eventoAnni)="riceviAnniDalFiglio($event)"
    >
    </app-son>

    <div>Dal componente figlio ho ricevuto il seguente nome: {{nomeRicevuto}}</div>

    <div>Anni ricevuti dal componente son: {{anniRicevuti}}</div>


</div>
