<div style="background-color: coral; width: 80%;">
    <h3>Gestione delle fatture</h3>
    <h2>Numero delle fatture presenti: {{contabilita.length}}</h2>

    <table border="1">
        @for (singola of contabilita; track singola.numero) {
        <tr>
            <app-dettaglio [dettaglioFattura]="singola"></app-dettaglio>
        </tr>
        }
    </table>
    <br>

</div>
